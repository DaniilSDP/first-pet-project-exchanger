spring.application.name=first-pet-project-exchanger

spring.datasource.url=jdbc:postgresql://localhost:5433/javadb
spring.datasource.username=postgres
spring.datasource.password=mT*pH&mc+U

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
server.shutdown=graceful

spring.threads.virtual.enabled=true

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE\:20}
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath\:db/changelog/db.changelog-master.yaml
spring.data.redis.host=${REDIS_HOST\:localhost}
spring.data.redis.port=${REDIS_PORT\:6379}
spring.data.redis.password=${REDIS_PASSWORD\:}
spring.data.redis.timeout=2s
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS\:localhost\:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.enable-idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=5
spring.kafka.consumer.group-id=ledger-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.ledger.messaging.OutboxMessage
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
ledger.security.jwt-secret=${JWT_SECRET\:change-me-to-a-very-long-secret-key-for-hs512-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
ledger.security.access-token-ttl=PT15M
ledger.security.refresh-token-ttl=P30D
ledger.security.refresh-token-store=${REFRESH_TOKEN_STORE\:redis}
ledger.idempotency.ttl=PT24H
ledger.transfer.fee-percent=${TRANSFER_FEE_PERCENT\:0.00}
ledger.transfer.min-amount=0.01
ledger.transfer.max-amount=1000000
ledger.rate-limit.login-per-minute=${LOGIN_RATE_LIMIT\:10}
ledger.rate-limit.transfer-per-minute=${TRANSFER_RATE_LIMIT\:30}
ledger.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS\:1000}
ledger.outbox.batch-size=${OUTBOX_BATCH_SIZE\:100}
ledger.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS\:10}
ledger.gateway.base-url=${GATEWAY_BASE_URL\:http\://localhost\:8081}
ledger.gateway.connect-timeout-ms=2000
ledger.gateway.read-timeout-ms=15000
ledger.gateway.settle-async=${GATEWAY_ASYNC\:false}
ledger.fx.pivot-currency=EUR
ledger.app.fee-wallet-owner-email=fees@ledger.internal
ledger.app.seed-admin-email=admin@ledger.com
